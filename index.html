<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CampusHub 1.0 — Your campus, one tap away.</title>
  <meta name="description" content="A unified web platform for college students to manage projects, share academic resources, find collaborators, and stay updated on campus events." />
  
  <!-- PWA Manifest & Theme Colors -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0F6E56" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Apple iOS Mobile Web App Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CampusHub" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <!-- Modern Typography: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Top Developer / Demo Toolbar (Gated per Fix 3: visible when ?dev=1 or devMode active) -->
  <header class="dev-toolbar" id="dev-toolbar" style="display: none;">
    <div class="dev-toolbar-info">
      <span class="brand-title">CampusHub 1.0 <span style="font-size:10px;opacity:0.8;font-weight:normal;">[Dev Mode]</span></span>
      <span class="role-badge" id="role-display-badge">Not Logged In</span>
    </div>
    <div class="dev-toolbar-actions">
      <button class="toolbar-btn" id="btn-switch-role" onclick="window.app && window.app.toggleUserRole()" title="Toggle Student / Admin role">
        ⇄ Switch Role
      </button>
      <button class="toolbar-btn" id="btn-toggle-frame" onclick="window.app && window.app.toggleViewMode()" title="Toggle Phone Simulator vs Wide Laptop View">
        📱 Mobile Frame
      </button>
      <button class="toolbar-btn" onclick="window.app && window.app.openModal('accounts_manager')" title="Manage 10 Student & 4 Admin Custom Accounts">
        👥 Accounts (10+4)
      </button>
      <button class="toolbar-btn" onclick="if(confirm('Reset all demo data and accounts to clean state?')){localStorage.clear();location.reload();}" title="Reset to clean state">
        ↺ Reset
      </button>
    </div>
  </header>

  <!-- Adaptive App Container (Responsive: Mobile / Tablet / Desktop with Sidebar) -->
  <main class="app-frame" id="app-frame">
    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Desktop Sidebar Navigation (Rendered when logged in on viewport >= 1024px) -->
    <aside class="sidebar-nav" id="sidebar-nav" style="display: none;"></aside>

    <!-- Scrollable Screen Area -->
    <div class="app-screen" id="app-screen">
      <div id="app-root">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>
  </main>

  <!-- ES Modules -->
  <script type="module" src="js/mockData.js"></script>
  <script type="module" src="js/store.js"></script>
  <script type="module" src="js/app.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('js/sw.js')
          .then(reg => console.log('ServiceWorker registered with scope:', reg.scope))
          .catch(err => console.warn('ServiceWorker registration error:', err));
      });
    }
  </script>

  <!-- Dev Toolbar Gating & Role Badge Realtime Sync -->
  <script>
    function checkDevMode() {
      const url = new URL(window.location.href);
      const isDev = url.searchParams.get('dev') === '1' || localStorage.getItem('devMode') === 'true';
      const devToolbar = document.getElementById('dev-toolbar');
      if (devToolbar) {
        devToolbar.style.display = isDev ? 'flex' : 'none';
      }
    }
    checkDevMode();

    setInterval(() => {
      if (window.app && window.app.store) {
        try {
          const state = window.app.store.getState();
          const badge = document.getElementById('role-display-badge');
          if (badge) {
            if (!state.currentUser) {
              badge.className = 'role-badge';
              badge.innerHTML = '🔒 Sign Up / Log In';
            } else if (state.currentUser.role === 'admin') {
              badge.className = 'role-badge admin';
              badge.innerHTML = '👑 Admin (' + state.currentUser.name + ')';
            } else {
              badge.className = 'role-badge';
              badge.innerHTML = '🎓 Student (' + state.currentUser.name + ')';
            }
          }
        } catch(e){}
      }
    }, 300);
  </script>
</body>
</html>
